channels: 1
scale_factor: 2
features: 64
residual_blocks: 4
loss:
  class_path: loss.LossCombination
  init_args:
    weights:
    - 0.99
    - 0.01
    losses:
    - class_path: loss.L1Loss
    - class_path: loss.ConservationLoss
      init_args:
        scale_factor: 2
        penalization: mae
upsample_method: transpose
_instantiator: lightning.pytorch.cli.instantiate_module
