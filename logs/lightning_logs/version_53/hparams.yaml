channels: 1
scale_factor: 16
features: 128
residual_blocks: 64
loss:
  class_path: loss.LossCombination
  init_args:
    weights:
    - 1.0
    losses:
    - class_path: loss.L1Loss
constraint:
  class_path: models.AddConstraintLayer
  init_args:
    scale_factor: 16
_instantiator: lightning.pytorch.cli.instantiate_module
