channels: 1
scale_factor: 10
features: 128
residual_blocks: 64
loss:
  class_path: loss.LossCombination
  init_args:
    weights:
    - 0.99
    - 0.01
    losses:
    - class_path: loss.L1Loss
    - class_path: loss.ConservationLoss
      init_args:
        scale_factor: 10
        penalization: mae
_instantiator: lightning.pytorch.cli.instantiate_module
