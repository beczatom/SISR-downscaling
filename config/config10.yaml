
model:
  class_path: models.EDSR
  init_args:
    channels: 1
    scale_factor: 10
    features: 128
    residual_blocks: 64
    loss:
      class_path: loss.LossCombination
      init_args:
        weights: {mae : 1}
        scale_factor: 10

data:
  class_path: datasets.ReKISDataModule
  init_args:
    batch_size : 32
#    path: /home/tomas/ctu/current/rci_data/climate/ReKIS/KlimRefDS_v3.1_1961-2023/Raster/Tag/GK4/
#    sets_years : ["1961", "1962", "1963", "1963", "1964", "1964"]
    path: /mnt/data/climate/ReKIS/KlimRefDS_v3.1_1961-2023/Raster/Tag/GK4/
    sets_years : ["1961", "1992", "1993", "2002", "2003", "2012"]


trainer:
  accelerator: gpu
  callbacks:
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: val/rmse
        mode: min
        patience: 20
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/rmse
        mode: min

  deterministic: true
  log_every_n_steps: 1
  logger:
    class_path : lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs

  max_epochs: -1
