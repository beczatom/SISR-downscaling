
model:
  class_path: models.EDSR
  init_args:
    channels: 1
    scale_factor: 10
    loss:
      class_path: torch.nn.L1Loss

data:
  class_path: datasets.ReKISDataModule
  init_args:
    batch_size : 32
#    path: /home/tomas/ctu/current/rci_data/climate/ReKIS/KlimRefDS_v3.1_1961-2023/Raster/Tag/GK4/
    path: /mnt/data/climate/ReKIS/KlimRefDS_v3.1_1961-2023/Raster/Tag/GK4/

trainer:
  accelerator: gpu
  callbacks:
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: val/mae
        mode: min
        patience: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mae
        mode: min

  deterministic: true
  log_every_n_steps: 1
  logger:
    class_path : lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs

  max_epochs: -1
