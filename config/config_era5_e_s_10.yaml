model:
  class_path: models.EDSR
  init_args:
    channels: 1
    scale_factor: 10
    features: 64
    residual_blocks: 4
    loss:
      class_path: loss.LossCombination
      init_args:
        weights:
          - 0.99
          - 0.01
        losses:
          - class_path: loss.L1Loss
          - class_path: loss.ConservationLoss
            init_args:
              scale_factor: 10
              penalization: 'mae'

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-4
    weight_decay: 1e-5

lr_scheduler:
  class_path: torch.optim.lr_scheduler.StepLR
  init_args:
    step_size: 50
    gamma: 0.9

data:
  class_path: datasets.Era5DataModule
  init_args:
    batch_size: 32
#    path: /home/tomas/ctu/current/rci_data/climate/ERA5-Land/1959-2025-hourly/era5_land_hourly_1959_2025.nc
#    sets_years : ['1959', '1960', '1961', '1961', '1962', '1962']
    path: /mnt/data/climate/ERA5-Land/1959-2025-hourly/era5_land_hourly_1959_2025.nc
    sets_years: ['1959', '1999', '2000', '2012', '2013', '2025']
    scale_factor: 10


trainer:
  accelerator: gpu
  callbacks:
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: val/rmse
        mode: min
        patience: 15
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/rmse
        mode: min

  deterministic: true
  log_every_n_steps: 1
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs

  max_epochs: -1
