model:
  class_path: models.EDSR
  init_args:
    channels: 1
    scale_factor: 16
    features: 8
    residual_blocks: 4
    loss:
      class_path: loss.LossCombination
      init_args:
        weights:
          - 0.99
          - 0.01
        losses:
          - class_path: loss.L1Loss
          - class_path: loss.ConservationLoss
            init_args:
              scale_factor: 16
              penalization: 'mae'

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-4
    weight_decay: 1e-5

lr_scheduler:
  class_path: torch.optim.lr_scheduler.StepLR
  init_args:
    step_size: 50
    gamma: 0.9

data:
  class_path: datasets.ReKISDataModule
  init_args:
    batch_size: 32
#    path: /home/tomas/ctu/current/rci_data/climate/ReKIS/KlimRefDS_v3.1_1961-2023/Raster/Tag/GK4/
#    sets_years : ["1961", "1962", "1963", "1963", "1964", "1964"]
    path: /mnt/data/climate/ReKIS/KlimRefDS_v3.1_1961-2023/Raster/Tag/GK4/
    sets_years: [ "1961", "1992", "1993", "2002", "2003", "2012" ]
    scale_factor: 16


trainer:
  accelerator: gpu
  callbacks:
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: val/rmse
        mode: min
        patience: 15
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/rmse
        mode: min

  deterministic: true
  log_every_n_steps: 1
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs

  max_epochs: -1
